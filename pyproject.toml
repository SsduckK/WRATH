[project]
name = "wrath"
version = "0.1.0"
description = "Local Warcraft Logs and combat log analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
    "requests>=2.34.2",
]

[project.scripts]
wrath = "wcl_analyzer.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcl_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
